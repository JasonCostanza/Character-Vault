<!DOCTYPE html>
<html lang="en">

<meta charset="UTF-8">

<title>Character Vault — Icon Replacement Tracker</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; color: #e8dcc8; font-family: 'Segoe UI', system-ui, sans-serif; padding: 24px; }
  h1 { font-size: 1.4rem; margin-bottom: 4px; color: #c0874a; }
  .subtitle { font-size: 0.85rem; color: #6a5a4a; margin-bottom: 24px; }
  h2 { font-size: 1.1rem; color: #c0874a; margin: 32px 0 12px; padding-bottom: 6px; border-bottom: 1px solid #2a2a3e; }
  h3 { font-size: 0.95rem; color: #b0a090; margin: 20px 0 8px; }

  .progress-bar { margin: 16px 0; background: #16162a; border-radius: 4px; height: 24px; position: relative; overflow: hidden; border: 1px solid #2a2a3e; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, #5a9e6e, #4a8e5e); transition: width 0.3s; border-radius: 3px; }
  .progress-label { position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: 600; color: #e8dcc8; text-shadow: 0 1px 2px rgba(0,0,0,0.5); }

  .legend { display: flex; gap: 20px; margin-bottom: 20px; font-size: 0.8rem; color: #b0a090; flex-wrap: wrap; }
  .legend span { display: flex; align-items: center; gap: 6px; }
  .legend .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .dot-gi { background: #c0874a; }
  .dot-lucide { background: #5a9e6e; }
  .dot-done { background: #5a9e6e; border: 2px solid #8fc; }
  .dot-pending { background: #6a5a4a; }

  .icon-table { width: 100%; border-collapse: collapse; margin-bottom: 16px; }
  .icon-table th { font-size: 0.7rem; color: #6a5a4a; text-transform: uppercase; letter-spacing: 0.5px; padding: 6px 8px; border-bottom: 1px solid #2a2a3e; text-align: left; }
  .icon-table td { padding: 6px 8px; border-bottom: 1px solid #16162a; vertical-align: middle; }
  .icon-table tr:hover td { background: #22223a; }
  .icon-table tr.done td { opacity: 0.6; }
  .icon-table tr.done td:first-child { text-decoration: line-through; }

  .cell-key { font-family: 'Consolas', monospace; font-size: 0.82rem; color: #b0a090; white-space: nowrap; }
  .cell-source { font-size: 0.78rem; color: #8a7a6a; }
  .cell-icon { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border-radius: 4px; }
  .cell-icon.current { background: #2a2a3e; }
  .cell-icon.replacement { background: #1e1e30; border: 1px solid #2a2a3e; }
  .cell-icon svg { width: 24px; height: 24px; color: #e8dcc8; }
  .cell-icon img { width: 24px; height: 24px; object-fit: contain; }
  /* GI icons arrive as white (#fff) on transparent — warm them to match --cv-text (#e8dcc8) */
  .cell-icon img.gi-img { filter: brightness(0.91) sepia(0.25) saturate(0.4); }
  /* Lucide icons arrive as black on transparent — invert first, then apply same warmth */
  .cell-icon img.lucide-img { filter: invert(1) brightness(0.91) sepia(0.25) saturate(0.4); }

  .tag { font-size: 0.6rem; padding: 1px 5px; border-radius: 3px; color: #1a1a2e; font-weight: 600; display: inline-block; margin-right: 4px; }
  .tag-gi { background: #c0874a; }
  .tag-lucide { background: #5a9e6e; }

  .status-check { cursor: pointer; width: 18px; height: 18px; appearance: none; border: 2px solid #6a5a4a; border-radius: 3px; background: transparent; position: relative; vertical-align: middle; }
  .status-check:checked { border-color: #5a9e6e; background: #5a9e6e; }
  .status-check:checked::after { content: '\2713'; position: absolute; top: -1px; left: 2px; font-size: 12px; color: #1a1a2e; font-weight: bold; }

  .toolbar { position: sticky; top: 0; z-index: 100; background: #12122a; padding: 10px 16px; border-bottom: 2px solid #c0874a; display: flex; align-items: center; gap: 12px; margin: -24px -24px 24px; padding: 12px 24px; flex-wrap: wrap; }
  .toolbar-btn { background: #c0874a; color: #1a1a2e; border: none; padding: 6px 12px; border-radius: 4px; font-weight: 600; font-size: 0.8rem; cursor: pointer; }
  .toolbar-btn:hover { background: #d89a5a; }
  .toolbar-btn.danger { background: #b84040; }
  .toolbar-btn.danger:hover { background: #d05050; }
  .toolbar-btn.secondary { background: #2a2a3e; color: #b0a090; }
  .toolbar-btn.secondary:hover { background: #3a3a5e; }
  .toolbar-stats { font-size: 0.8rem; color: #b0a090; margin-left: auto; }

  .section-toggle { cursor: pointer; user-select: none; }
  .section-toggle::before { content: '\25BC '; font-size: 0.7rem; color: #6a5a4a; }
  .section-toggle.collapsed::before { content: '\25B6 '; }
  .section-content.hidden { display: none; }

  .phase-badge { display: inline-block; font-size: 0.65rem; padding: 2px 6px; border-radius: 3px; background: #2a2a3e; color: #8a7a6a; margin-left: 8px; }
  .phase-badge.active { background: #c0874a; color: #1a1a2e; }
  .phase-badge.complete { background: #5a9e6e; color: #1a1a2e; }

  .notes-input { width: 100%; font-size: 0.75rem; padding: 3px 6px; background: #16162a; border: 1px solid #2a2a3e; color: #b0a090; border-radius: 3px; font-family: 'Consolas', monospace; margin-top: 4px; }
  .notes-input:focus { border-color: #c0874a; outline: none; }

  .filter-bar { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .filter-btn { font-size: 0.75rem; padding: 4px 10px; border-radius: 3px; border: 1px solid #2a2a3e; background: transparent; color: #8a7a6a; cursor: pointer; }
  .filter-btn:hover { border-color: #6a5a4a; }
  .filter-btn.active { border-color: #c0874a; color: #c0874a; background: #2a1a0a; }

<body>

<h1>Icon Replacement Tracker</h1>
<p class="subtitle">Persistent state — picks & progress saved to localStorage. Tracks the full icon replacement plan.</p>

<div class="toolbar">
  <button class="toolbar-btn" onclick="markAllVisible('done')">Mark Visible Done</button>
  <button class="toolbar-btn secondary" onclick="markAllVisible('undone')">Unmark Visible</button>
  <button class="toolbar-btn secondary" onclick="exportState()">Export JSON</button>
  <button class="toolbar-btn secondary" onclick="importState()">Import JSON</button>
  <button class="toolbar-btn danger" onclick="resetState()">Reset All</button>
  <span class="toolbar-stats" id="stats"></span>
</div>

<div class="progress-bar">
  <div class="progress-fill" id="progress-fill"></div>
  <div class="progress-label" id="progress-label"></div>
</div>

<div class="filter-bar">
  <button class="filter-btn active" data-filter="all" onclick="setFilter('all')">All</button>
  <button class="filter-btn" data-filter="pending" onclick="setFilter('pending')">Pending</button>
  <button class="filter-btn" data-filter="done" onclick="setFilter('done')">Done</button>
  <button class="filter-btn" data-filter="gi" onclick="setFilter('gi')">game-icons.net</button>
  <button class="filter-btn" data-filter="lucide" onclick="setFilter('lucide')">Lucide</button>
</div>

<div id="app"></div>

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : { done: {}, notes: {}, collapsed: {} };
  } catch { return { done: {}, notes: {}, collapsed: {} }; }
}

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE));
  updateProgress();
}

// ── Rendering ──
function getAllItems() {
  const all = [];
  for (const [sectionId, section] of Object.entries(PLAN)) {
    for (const item of section.items) {
      all.push({ sectionId, ...item, id: `${sectionId}::${item.key}` });
    }
  }
  return all;
}

function updateProgress() {
  const all = getAllItems();
  const doneCount = all.filter(i => STATE.done[i.id]).length;
  const total = all.length;
  const pct = total ? Math.round((doneCount / total) * 100) : 0;
  const fill = document.getElementById('progress-fill');
  const label = document.getElementById('progress-label');
  const stats = document.getElementById('stats');
  if (fill) fill.style.width = pct + '%';
  if (label) label.textContent = `${doneCount} / ${total} (${pct}%)`;
  if (stats) stats.textContent = `${doneCount}/${total} done`;
}

function giUrl(author, name) {
  return `https://game-icons.net/icons/ffffff/transparent/1x1/${author}/${name}.svg`;
}

function lucideUrl(name) {
  return `https://unpkg.com/lucide-static@latest/icons/${name}.svg`;
}

function setFilter(f) {
  FILTER = f;
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.filter === f);
  });
  render();
}

function toggleSection(sectionId) {
  STATE.collapsed[sectionId] = !STATE.collapsed[sectionId];
  saveState();
  render();
}

function toggleDone(id) {
  STATE.done[id] = !STATE.done[id];
  saveState();
  render();
}

function updateNote(id, value) {
  if (value.trim()) {
    STATE.notes[id] = value.trim();
  } else {
    delete STATE.notes[id];
  }
  saveState();
}

function markAllVisible(action) {
  const checkboxes = document.querySelectorAll('.status-check');
  checkboxes.forEach(cb => {
    const id = cb.dataset.id;
    if (action === 'done') STATE.done[id] = true;
    else delete STATE.done[id];
  });
  saveState();
  render();
}

function exportState() {
  const json = JSON.stringify(STATE, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'icon-replacement-state.json';
  a.click();
  URL.revokeObjectURL(url);
}

function importState() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json';
  input.onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        STATE = JSON.parse(ev.target.result);
        saveState();
        render();
      } catch (err) {
        alert('Invalid JSON file');
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

function resetState() {
  if (!confirm('Reset all progress? This cannot be undone.')) return;
  STATE = { done: {}, notes: {}, collapsed: {} };
  saveState();
  render();
}

function render() {
  const app = document.getElementById('app');
  let html = '';

  for (const [sectionId, section] of Object.entries(PLAN)) {
    const sectionItems = section.items.map(item => ({
      ...item,
      id: `${sectionId}::${item.key}`
    }));

    // Filter
    let visible = sectionItems;
    if (FILTER === 'pending') visible = sectionItems.filter(i => !STATE.done[i.id]);
    else if (FILTER === 'done') visible = sectionItems.filter(i => STATE.done[i.id]);
    else if (FILTER === 'gi') visible = sectionItems.filter(i => i.source === 'gi');
    else if (FILTER === 'lucide') visible = sectionItems.filter(i => i.source === 'lucide');

    if (visible.length === 0 && FILTER !== 'all') continue;

    const doneInSection = sectionItems.filter(i => STATE.done[i.id]).length;
    const totalInSection = sectionItems.length;
    const collapsed = STATE.collapsed[sectionId];

    const phaseBadgeClass = doneInSection === totalInSection ? 'complete' : (doneInSection > 0 ? 'active' : '');

    html += `<h2 class="section-toggle ${collapsed ? 'collapsed' : ''}" onclick="toggleSection('${sectionId}')">${section.title} <span style="font-size:0.75rem;color:#6a5a4a">(${doneInSection}/${totalInSection})</span><span class="phase-badge ${phaseBadgeClass}">Phase ${section.phase}</span></h2>`;

    if (!collapsed) {
      html += `<p style="font-size:0.75rem;color:#6a5a4a;margin-bottom:8px">${section.target}</p>`;
      html += `<div class="section-content">`;
      html += `<table class="icon-table"><thead><tr><th>Done</th><th>Key</th><th>Source</th><th>Replacement</th><th>Preview</th></tr></thead><tbody>`;

      for (const item of visible) {
        const isDone = STATE.done[item.id];
        const rowClass = isDone ? 'done' : '';

        let sourceTag = '';
        let replacementText = '';
        let previewHtml = '';

        if (item.source === 'gi') {
          sourceTag = `<span class="tag tag-gi">GI</span>`;
          replacementText = `${item.author}/${item.name}`;
          const url = giUrl(item.author, item.name);
          previewHtml = `<div class="cell-icon replacement"><img class="gi-img" src="${url}" alt="${item.name}" onerror="this.style.opacity='0.3'"></div>`;
        } else if (item.source === 'lucide') {
          sourceTag = `<span class="tag tag-lucide">Lucide</span>`;
          replacementText = item.name + (item.size ? ` (${item.size})` : '');
          const url = lucideUrl(item.name);
          previewHtml = `<div class="cell-icon replacement"><img class="lucide-img" src="${url}" alt="${item.name}" onerror="this.style.opacity='0.3'"></div>`;
        } else {
          replacementText = item.name;
          previewHtml = `<span style="font-size:0.7rem;color:#6a5a4a">—</span>`;
        }

        if (item.note) replacementText += ` <span style="font-size:0.65rem;color:#6a5a4a">(${item.note})</span>`;

        html += `<tr class="${rowClass}">`;
        html += `<td><input type="checkbox" class="status-check" data-id="${item.id}" ${isDone ? 'checked' : ''} onchange="toggleDone('${item.id}')"></td>`;
        html += `<td class="cell-key">${item.key}</td>`;
        html += `<td>${sourceTag} <span class="cell-source">${replacementText}</span></td>`;
        html += `<td>${previewHtml}</td>`;
        html += `<td style="min-width:120px"><input class="notes-input" placeholder="notes..." value="${STATE.notes[item.id] || ''}" onchange="updateNote('${item.id}', this.value)"></td>`;
        html += `</tr>`;
      }

      html += `</tbody></table></div>`;
    }
  }

  html += `<div style="margin-top:40px;padding:16px;background:#16162a;border-radius:6px;font-size:0.8rem;color:#6a5a4a">
    <strong style="color:#b0a090">Implementation Phases:</strong><br>
    <strong>Phase 1</strong> — CV_ICONS entries (74 icons: game-icons.net + Lucide)<br>
    <strong>Phase 2</strong> — CV_SVG_* constants + main.html inline SVGs<br>
    <strong>Phase 3</strong> — Module script inline SVGs → reference CV_SVG_* constants<br>
    <strong>Phase 4</strong> — Attribution file + lint verification<br><br>
    <strong style="color:#b0a090">Sources:</strong><br>
    • <a href="https://game-icons.net" target="_blank" style="color:#c0874a">game-icons.net</a> — RPG content (filled silhouettes, CC BY 3.0)<br>
    • <a href="https://lucide.dev/icons/" target="_blank" style="color:#5a9e6e">lucide.dev</a> — UI chrome (stroke outlines, ISC)<br><br>
    <strong style="color:#b0a090">Constraints:</strong><br>
    • Icon keys in CV_ICONS must NOT change (save data compatibility)<br>
    • game-icons.net viewBox stays 0 0 512 512 (Option A — keep original paths)<br>
    • Lucide viewBox stays 0 0 24 24<br>
    • All icons use <code style="color:#c0874a">currentColor</code> for theme inheritance<br>
    • CONDITION_ICON_SVG dictionary is untouched (separate system)
  </div>`;

  app.innerHTML = html;
  updateProgress();
}

render();
</script>
